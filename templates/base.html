<!doctype html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ t.site_title }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">🔮 {{ t.site_title }}</a>
        <nav class="nav">
            <a href="{{ url_for('index') }}">{{ t.nav_home }}</a>
            <a href="{{ url_for('cards_page') }}">{{ t.nav_cards }}</a>
            <a href="{{ url_for('reading_page') }}">{{ t.nav_reading }}</a>
        </nav>
        <div class="lang-switch">
            <a href="?lang=fr" class="{{ 'active' if lang == 'fr' else '' }}">FR</a>
            <span>/</span>
            <a href="?lang=tr" class="{{ 'active' if lang == 'tr' else '' }}">TR</a>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>{{ t.footer_note }}</p>
    </footer>
</body>
</html>
