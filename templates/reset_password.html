{% extends "base.html" %}
{% block title %}{{ t.reset_password_title }} · {{ t.site_title }}{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1>{{ t.reset_password_title }}</h1>
        <p class="auth-subtitle">{{ t.reset_password_desc }}</p>

        <form method="post" class="auth-form">
            <input type="password" name="password" placeholder="{{ t.field_new_password }}" required autocomplete="new-password">
            <input type="password" name="password2" placeholder="{{ t.field_new_password_confirm }}" required autocomplete="new-password">
            <button type="submit" class="btn btn-primary full">{{ t.reset_password_submit }}</button>
        </form>

        <p class="auth-link"><a href="{{ url_for('login_page') }}">{{ t.back_to_login }}</a></p>
    </div>
</section>
{% endblock %}
