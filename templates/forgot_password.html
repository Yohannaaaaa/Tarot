{% extends "base.html" %}
{% block title %}{{ t.forgot_password_title }} · {{ t.site_title }}{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1>{{ t.forgot_password_title }}</h1>
        <p class="auth-subtitle">{{ t.forgot_password_desc }}</p>

        <form method="post" class="auth-form">
            <input type="email" name="email" placeholder="{{ t.field_email }}" required autocomplete="email">
            <button type="submit" class="btn btn-primary full">{{ t.forgot_password_submit }}</button>
        </form>

        <p class="auth-link"><a href="{{ url_for('login_page') }}">{{ t.back_to_login }}</a></p>
    </div>
</section>
{% endblock %}
