name: Build mobile app (debug APK)

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-app.yml'
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold Android platform folder (android/ is not committed to git)
        run: flutter create --platforms=android --org com.rituams .

      - name: Set application id to com.rituams.tarot (matches the existing Play Store listing)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.rituams.rituams_tarot"/applicationId = "com.rituams.tarot"/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "com.rituams.rituams_tarot"/applicationId "com.rituams.tarot"/' android/app/build.gradle
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="rituams_tarot"/android:label="Rituams Tarot"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rituams-tarot-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
